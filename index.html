<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberpunk Keyboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #050505;
        color: #e0e0e0;
        font-family: 'VT323', monospace;
      }
      .font-cyber {
        font-family: 'Orbitron', sans-serif;
      }
      
      /* Scrollbar customization */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0f0f; 
      }
      ::-webkit-scrollbar-thumb {
        background: #00f3ff; 
        border: 2px solid #0f0f0f;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ff00ff; 
      }

      /* Scanline effect */
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        position: absolute;
        pointer-events: none;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 10;
      }

      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 5px #00f3ff, 0 0 10px #00f3ff; }
        50% { box-shadow: 0 0 20px #00f3ff, 0 0 30px #00f3ff; }
      }

      @keyframes popup {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes implode {
        0% { transform: scale(1) rotate(0deg); opacity: 1; }
        100% { transform: scale(0) rotate(720deg); opacity: 0; }
      }

      .animate-popup {
        animation: popup 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      .animate-implode {
        animation: implode 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "matter-js": "https://esm.sh/matter-js@0.19.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
